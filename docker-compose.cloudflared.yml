# Reason: explicit project name keeps this stack isolated from other compose files in this directory.
name: cloudflared

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    user: "1001:1001"
    command: ["tunnel","--config","/etc/cloudflared/config.yml","--no-autoupdate","run"]    
    networks:
      - frynet  
    volumes:
      - /home/helpdesk/.cloudflared:/etc/cloudflared:ro

networks:
  frynet:
    name: frynet
    # Reason: shared network across separate compose projects.
    external: true
    driver: bridge
